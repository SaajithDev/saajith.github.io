<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Match Game</title>
  <style>
    /* Clean, modern style matching Wordwall */
    body { font-family: system-ui, sans-serif; background: #f9fafb; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    .game-container { display: flex; gap: 20px; margin-top: 15px; }
    .column { display: flex; flex-direction: column; gap: 10px; }
    .card { padding: 12px 20px; background: white; border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer; user-select: none; transition: 0.2s; font-weight: 500; text-align: center;}
    .card.selected { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
    .card.matched { background: #dcfce7; border-color: #22c55e; color: #166534; cursor: default; }
    #msg { margin-top: 15px; font-weight: bold; color: #22c55e; }
  </style>
</head>
<body>

  <h3>Match the Pairs</h3>
  <div class="game-container">
    <div class="column" id="left-col"></div>
    <div class="column" id="right-col"></div>
  </div>
  <div id="msg"></div>

  <script>
    // Define your matching data here
    const pairs = [
      { left: "Apple", right: "Red Fruit" },
      { left: "Banana", right: "Yellow Fruit" },
      { left: "Sky", right: "Blue Atmosphere" }
    ];

    let selectedLeft = null;
    let selectedRight = null;
    let matchesCount = 0;

    // Render game cards
    function initGame() {
      const leftCol = document.getElementById('left-col');
      const rightCol = document.getElementById('right-col');
      
      // Shuffle columns independently
      const shuffledLeft = [...pairs].sort(() => Math.random() - 0.5);
      const shuffledRight = [...pairs].sort(() => Math.random() - 0.5);

      shuffledLeft.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = p.left;
        div.onclick = () => selectCard(div, 'left', p.left);
        leftCol.appendChild(div);
      });

      shuffledRight.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerText = p.right;
        div.onclick = () => selectCard(div, 'right', p.right);
        rightCol.appendChild(div);
      });
    }

    function selectCard(element, side, value) {
      if (element.classList.contains('matched')) return;

      // Clear previous selection on same side
      const siblings = element.parentNode.querySelectorAll('.card');
      siblings.forEach(s => s.classList.remove('selected'));
      element.classList.add('selected');

      if (side === 'left') selectedLeft = { element, value };
      if (side === 'right') selectedRight = { element, value };

      // Check for match
      if (selectedLeft && selectedRight) {
        const correctPair = pairs.find(p => p.left === selectedLeft.value && p.right === selectedRight.value);
        
        if (correctPair) {
          selectedLeft.element.className = 'card matched';
          selectedRight.element.className = 'card matched';
          matchesCount++;
          
          if (matchesCount === pairs.length) {
            document.getElementById('msg').innerText = "Game Completed!";
            sendDataToTally("All pairs matched perfectly!");
          }
        } else {
          // Reset styling if wrong match
          const l = selectedLeft.element;
          const r = selectedRight.element;
          setTimeout(() => {
            l.classList.remove('selected');
            r.classList.remove('selected');
          }, 400);
        }
        selectedLeft = null;
        selectedRight = null;
      }
    }

    // THIS IS THE SECRET SAUCE: Sends the data out of the iframe straight into Tally's hidden field
    function sendDataToTally(resultData) {
      window.parent.postMessage(
        {
          type: 'tally-value', 
          name: 'game_data', // Must exactly match your Tally Hidden Field name
          value: resultData
        }, 
        '*'
      );
    }

    initGame();
  </script>
</body>
</html>
